<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gradient for Lower Chevron (Verse V) -->
    <linearGradient id="mv-silver-grad" x1="20%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E5EB" />
      <stop offset="100%" stop-color="#A6ABB5" />
    </linearGradient>
  </defs>

  <!-- Black Background with soft rounded corners for modern app icon look -->
  <rect width="512" height="512" rx="96" fill="#000000" />

  <!-- Upper Glyph: Muda 'M' Monogram -->
  <path
    d="M 56,48 
       L 256,248 
       L 456,48 
       L 456,114 
       L 256,314 
       L 102,160 
       L 102,432 
       L 56,432 
       Z"
    fill="#FFFFFF"
  />

  <!-- Lower Glyph: Verse 'V' Chevron -->
  <path
    d="M 138,268 
       L 256,386 
       L 456,186 
       L 456,252 
       L 256,452 
       L 138,334 
       Z"
    fill="url(#mv-silver-grad)"
  />
</svg>
